name: Check Google integration candidate
on:
  push:
    branches: [google-sheets-integration]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  isolated-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check app.js
          node --check google-store.js
          node --check excel-export.js
          node tests/backend.cjs
          node tests/excel.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-excel-fixture
          path: test-results/template-export.xlsx
