name: Check Google integration candidate
on:
  push:
    branches: [google-sheets-integration, private-reader-access]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  isolated-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.58.2 pdf-lib@1.17.1
      - run: npx playwright install --with-deps chromium
      - run: |
          node --check app.js
          node --check demo-store.js
          node --check demo-view.js
          node tests/demo-store.cjs
          node --check google-store.js
          node tests/google-store.cjs
          node tests/guest-store.cjs
          node --check excel-export.js
          node scripts/build-guest.cjs
          node tests/guest-backend.cjs
          node tests/backend.cjs
          node tests/excel.cjs
          python3 -m http.server 8765 &
          node tests/cloud-browser.cjs
          node tests/guest-browser.cjs
          node tests/demo-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-excel-fixture
          path: test-results/
