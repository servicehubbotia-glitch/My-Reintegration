name: Validate and publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only browser tools
        run: npm install --no-save --package-lock=false playwright@1.58.2 pdf-lib@1.17.1
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check google-store.js
          node tests/backend.cjs
          node tests/excel.cjs
      - name: Exercise desktop and mobile workflows
        run: |
          python3 -m http.server 8765 &
          node tests/cloud-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-results
          path: test-results/
      - name: Package public application only
        run: |
          mkdir _site
          cp index.html style.css app.js google-config.js google-store.js excel-export.js _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
